name: Quick checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quick-checks-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  # PR checks may be superseded; never cancel an in-flight main migration/deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  worker:
    name: worker
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/worker/package-lock.json
      - run: npm ci
        working-directory: apps/worker
      - run: npm run typecheck
        working-directory: apps/worker
      - run: npm run test:catalog
        working-directory: apps/worker
      - run: npm run test:media
        working-directory: apps/worker
      - run: npm run test:owner
        working-directory: apps/worker
      - run: npm run test:rental-terms
        working-directory: apps/worker
      - run: npm run test:owner-auth
        working-directory: apps/worker
      - run: npm run test:admin
        working-directory: apps/worker
      - run: npm run test:preview-auth
        working-directory: apps/worker
      - run: npm run test:contact-workflow
        working-directory: apps/worker
      - run: npm run test:management
        working-directory: apps/worker
      - run: python3 -B -m unittest discover -s scripts/tests
      - run: python3 scripts/check_orchestration_state.py --base HEAD^

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm ci --prefix ../worker
        working-directory: apps/web
      - run: npm run typecheck
        working-directory: apps/web
      - run: npm run test:selection
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: npm run build:preview
        working-directory: apps/web
      - name: Validate generated private Preview configuration
        run: python3 scripts/preview_cd_guard.py target --generated apps/web/dist/alquileres_uspa_lab/wrangler.json
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e:preview-auth:local
        working-directory: apps/web
      - run: npm run test:e2e:m3
        working-directory: apps/web

  staging-private:
    name: staging-private
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [worker, web]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      issues: write
    concurrency:
      group: alquileres-uspa-private-preview
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail-closed release gate
        id: gate
        env:
          CF_PREVIEW_CD_ENABLED: ${{ vars.CF_PREVIEW_CD_ENABLED }}
          CF_PREVIEW_D1_PROVENANCE: ${{ vars.CF_PREVIEW_D1_PROVENANCE }}
          CF_PREVIEW_PLAN_STATUS: ${{ vars.CF_PREVIEW_PLAN_STATUS }}
          CF_PREVIEW_ACCESS_STATUS: ${{ vars.CF_PREVIEW_ACCESS_STATUS }}
          CF_PREVIEW_API_TOKEN: ${{ secrets.CF_PREVIEW_API_TOKEN }}
        run: |
          args=(gate --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF" \
            --enabled "$CF_PREVIEW_CD_ENABLED" \
            --provenance "$CF_PREVIEW_D1_PROVENANCE" \
            --plan-status "$CF_PREVIEW_PLAN_STATUS" \
            --access-status "$CF_PREVIEW_ACCESS_STATUS")
          if [[ -n "$CF_PREVIEW_API_TOKEN" ]]; then args+=(--token-present); fi
          python3 scripts/preview_cd_guard.py "${args[@]}"
      - name: Set up Node
        if: steps.gate.outputs.deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web and Worker dependencies
        if: steps.gate.outputs.deploy == 'true'
        run: |
          npm ci --prefix apps/web
          npm ci --prefix apps/worker
      - name: Build D3.1 against the pinned Preview runtime
        if: steps.gate.outputs.deploy == 'true'
        run: npm --prefix apps/web run build:preview
      - name: Validate exact Preview target and generated build config
        if: steps.gate.outputs.deploy == 'true'
        run: python3 scripts/preview_cd_guard.py target --generated apps/web/dist/alquileres_uspa_lab/wrangler.json
      - name: Read the existing private Preview and its latest immutable deployment
        id: before
        if: steps.gate.outputs.deploy == 'true'
        env:
          CF_PREVIEW_API_TOKEN: ${{ secrets.CF_PREVIEW_API_TOKEN }}
        run: python3 scripts/preview_cd_guard.py current-preview
      - name: Verify anonymous Access denial before publication
        if: steps.gate.outputs.deploy == 'true'
        run: python3 scripts/preview_cd_guard.py smoke "${{ steps.before.outputs.stable_url }}" "${{ steps.before.outputs.immutable_url }}"
      - name: Verify the current Preview JWT secret exists without reading its value
        if: steps.gate.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PREVIEW_API_TOKEN }}
        working-directory: apps/web
        run: python3 ../../scripts/preview_cd_guard.py preview-secret
      - name: Verify the source is current protected main
        if: steps.gate.outputs.deploy == 'true'
        run: python3 scripts/preview_cd_guard.py latest-main --sha "$GITHUB_SHA"
      - name: Reject D1 migration/schema changes since the last verified Preview
        if: steps.gate.outputs.deploy == 'true'
        run: python3 scripts/preview_cd_guard.py schema-diff --base-sha "${{ steps.before.outputs.source_sha }}" --head-sha "$GITHUB_SHA"
      - name: Verify the synthetic D1 provenance baseline
        if: steps.gate.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PREVIEW_API_TOKEN }}
        run: python3 scripts/preview_cd_guard.py provenance
      - name: Require zero pending migrations (read-only)
        if: steps.gate.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PREVIEW_API_TOKEN }}
        run: python3 scripts/preview_cd_guard.py migrations --require-none
      - name: Recheck main before Preview publication
        if: steps.gate.outputs.deploy == 'true'
        run: python3 scripts/preview_cd_guard.py latest-main --sha "$GITHUB_SHA"
      - name: Update only the existing private Preview
        id: deploy
        if: steps.gate.outputs.deploy == 'true'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PREVIEW_API_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/preview-result.json
        run: |
          set -euo pipefail
          npx --no-install wrangler preview --name private --worker-name alquileres-uspa-lab \
            --config dist/alquileres_uspa_lab/wrangler.json \
            --message "main ${GITHUB_SHA}" --json
          python3 ../../scripts/preview_cd_guard.py deploy-output \
            --file "$RUNNER_TEMP/preview-result.json"
      - name: Verify the JWT secret remains available on the updated Preview
        if: steps.gate.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PREVIEW_API_TOKEN }}
        working-directory: apps/web
        run: python3 ../../scripts/preview_cd_guard.py preview-secret
      - name: Verify latest Preview deployment SHA and ID
        id: published
        if: steps.gate.outputs.deploy == 'true'
        env:
          CF_PREVIEW_API_TOKEN: ${{ secrets.CF_PREVIEW_API_TOKEN }}
        run: python3 scripts/preview_cd_guard.py current-preview --sha "$GITHUB_SHA" --deployment-id "${{ steps.deploy.outputs.deployment_id }}"
      - name: Verify Access still blocks the stable and immutable URLs
        id: smoke
        if: steps.gate.outputs.deploy == 'true'
        run: python3 scripts/preview_cd_guard.py smoke "${{ steps.published.outputs.stable_url }}" "${{ steps.published.outputs.immutable_url }}"
      - name: Record verified Preview release
        if: steps.gate.outputs.deploy == 'true' && steps.smoke.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          STABLE_URL: ${{ steps.published.outputs.stable_url }}
          IMMUTABLE_URL: ${{ steps.published.outputs.immutable_url }}
          DEPLOYMENT_ID: ${{ steps.published.outputs.deployment_id }}
        run: |
          set -euo pipefail
          body=$(printf 'Automated private Preview release\n\n- Source SHA: `%s`\n- Deployment ID: `%s`\n- Stable URL: %s\n- Immutable URL: %s\n- Anonymous Access checks: 12/12 denied before application access.\n- D1: existing synthetic Preview; provenance verified; zero migrations pending; no schema files changed since the previous verified deployment.\n- No production, Access policy changes, migration writes, R2, resource creation, seed, or external data.\n- Remote authenticated browser journeys: BLOCKED_AUTH unless an approved Access session is available; local Playwright remains the functional CI gate.' "$SOURCE_SHA" "$DEPLOYMENT_ID" "$STABLE_URL" "$IMMUTABLE_URL")
          gh issue comment 49 --repo "$GITHUB_REPOSITORY" --body "$body"
          gh issue comment 25 --repo "$GITHUB_REPOSITORY" --body "$body"
