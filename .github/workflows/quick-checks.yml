name: Quick checks

on:
  pull_request:
  push:
    branches:
      - main
      - 'work/**'

permissions:
  contents: read

concurrency:
  group: quick-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    name: worker
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/worker/package-lock.json
      - run: npm ci
        working-directory: apps/worker
      - run: npm run typecheck
        working-directory: apps/worker
      - run: npm run test:catalog
        working-directory: apps/worker

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run typecheck
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
